name: publish-portfolio-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-portfolio-image
  cancel-in-progress: true

env:
  REGISTRY: harbor.home.tom-mendy.com
  IMAGE_NAME: harbor.home.tom-mendy.com/portfolio/portfolio
  IMAGE_SHA_TAG: sha-${{ forgejo.sha }}
  BUILDKITD_FLAGS: >-
    --oci-worker-snapshotter=fuse-overlayfs
    --oci-worker-no-process-sandbox

jobs:
  publish:
    runs-on: buildkit
    timeout-minutes: 30
    container:
      image: harbor.home.tom-mendy.com/homelab/ci/buildkit-forgejo@sha256:573c108b9221ef005ba2d62885f64b0028147ce5dbfc0b267843530ab286b26f
      credentials:
        username: ${{ secrets.HARBOR_REGISTRY_USER }}
        password: ${{ secrets.HARBOR_REGISTRY_TOKEN }}

    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          clean: true

      - name: Configure Harbor authentication
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.HARBOR_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.HARBOR_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_TOKEN"
          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_TOKEN" | base64 | tr -d '\\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$auth" > "$HOME/.docker/config.json"

      - name: Build and publish image
        shell: bash
        run: |
          set -euo pipefail
          buildctl-daemonless.sh build \
            --frontend dockerfile.v0 \
            --progress=plain \
            --local context=. \
            --local dockerfile=. \
            --opt platform=linux/amd64 \
            --opt "label:org.opencontainers.image.source=$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY" \
            --opt "label:org.opencontainers.image.revision=$FORGEJO_SHA" \
            --output "type=image,\"name=$IMAGE_NAME:$IMAGE_SHA_TAG,$IMAGE_NAME:latest\",push=true" \
            --import-cache type=registry,ref="$IMAGE_NAME:buildcache" \
            --export-cache type=registry,ref="$IMAGE_NAME:buildcache",mode=max
