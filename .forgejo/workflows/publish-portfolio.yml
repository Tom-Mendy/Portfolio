name: publish-portfolio-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-portfolio-image
  cancel-in-progress: true

env:
  REGISTRY: forgejo.tom-mendy.com
  IMAGE_NAME: forgejo.tom-mendy.com/tom-mendy/portfolio
  IMAGE_SHA_TAG: sha-${{ forgejo.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          clean: true

      - name: Log in to the Forgejo registry
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ forgejo.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build the image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.source=$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY" \
            --label "org.opencontainers.image.revision=$FORGEJO_SHA" \
            --tag "$IMAGE_NAME:$IMAGE_SHA_TAG" \
            .

      - name: Push the immutable commit tag
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            docker push "$IMAGE_NAME:$IMAGE_SHA_TAG" && exit 0
            sleep 15
          done
          exit 1

      - name: Update the main tag
        if: forgejo.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$IMAGE_NAME:$IMAGE_SHA_TAG" "$IMAGE_NAME:latest"
          for attempt in 1 2 3; do
            docker push "$IMAGE_NAME:latest" && exit 0
            sleep 15
          done
          exit 1
