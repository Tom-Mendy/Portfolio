worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  map $http_accept_language $preferred_locale {
    "~*^en(?:[-_]|,|;|$)" en;
    default fr;
  }

  map $uri $language_vary {
    / "Accept-Language";
    default "";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Vary $language_vary always;

    error_page 404 /404.html;

    location = / {
      return 302 /$preferred_locale/;
    }

    location = /projects/homelab {
      return 301 /fr/projects/homelab/;
    }

    location = /projects/homelab/ {
      return 301 /fr/projects/homelab/;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    location = /404.html {
      internal;
    }

    location /_astro/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:svg|ico|png|pdf|woff2)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000" always;
    }
  }
}
