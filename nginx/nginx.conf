server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-XSS-Protection "1; mode=block";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';";
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # SvelteKit immutable assets (JS/CSS with hashes)
  location /_app/immutable/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";

    # Re-add security headers as add_header in a block overrides parent headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }

  # Other static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # SVG, Images, Fonts
  location ~* \.(?:svg|ico|jpg|jpeg|png|gif|woff|woff2|ttf|otf)$ {
    expires 1M;
    add_header Cache-Control "public";

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
  }
}
